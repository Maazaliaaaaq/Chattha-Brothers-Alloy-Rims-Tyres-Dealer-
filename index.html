<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chattha Brothers — Alloy Rims & Tyres Inventory</title>
    <meta name="description" content="Stock tracking, low inventory alerts, and analytics for Chattha Brothers Alloy Rims & Tyres Dealer" />
    <meta property="og:title" content="Chattha Brothers — Alloy Rims & Tyres Inventory" />
    <meta property="og:description" content="Stock tracking, low inventory alerts, and analytics for Chattha Brothers Alloy Rims & Tyres Dealer" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body {
        background-color: #f8fafc;
        color: #0f172a;
        margin: 0;
        padding: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var isDev = window.location.port === '3000' ||
                    window.location.hostname.includes('run.app') ||
                    window.location.hostname.includes('webcontainer') ||
                    !!window.__vite_plugin_react_preamble_installed__;

        if (!isDev) {
          var hasBundledScript = Array.from(document.scripts).some(function(s) {
            return s.src && s.src.indexOf('assets/index.js') !== -1;
          });

          if (!hasBundledScript) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.crossOrigin = 'anonymous';
            link.href = './assets/index.css';
            document.head.appendChild(link);

            var script = document.createElement('script');
            script.type = 'module';
            script.crossOrigin = 'anonymous';
            script.src = './assets/index.js';
            document.body.appendChild(script);
          }
        }
      })();
    </script>
  </body>
</html>
